<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Niffer Cosmetics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843' },
            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
            cream: '#fef7f0'
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cream font-sans text-gray-800 antialiased">
  <div class="bg-primary-700 text-white text-center py-2 text-sm">
    <span data-i18n="announcement">Free delivery in Dar es Salaam for orders over TZS 50,000 | Referral commissions available!</span>
  </div>

  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-primary-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-display font-bold text-lg">N</div>
          <div>
            <span class="font-display text-xl font-semibold text-primary-800">Niffer</span>
            <span class="text-xs block text-primary-500 -mt-1 tracking-wider">COSMETICS</span>
          </div>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="index.html" class="text-gray-600 hover:text-primary-600" data-i18n="nav_home">Home</a>
          <a href="products.html" class="text-gray-600 hover:text-primary-600" data-i18n="nav_shop">Shop</a>
          <a href="referral.html" class="text-gray-600 hover:text-primary-600" data-i18n="nav_referral">Refer & Earn</a>
        </div>
        <div class="flex items-center gap-3">
          <button id="langToggle" class="flex items-center gap-1 px-3 py-1.5 rounded-full border border-primary-200 text-sm font-medium hover:bg-primary-50">
            <span id="langLabel">EN</span>
          </button>
          <a href="account.html" class="p-2 rounded-full hover:bg-primary-50">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </a>
          <a href="cart.html" class="relative p-2 rounded-full hover:bg-primary-50">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-primary-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-medium hidden">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" id="productDetail">
    <!-- Injected by JS -->
  </main>

  <footer class="bg-primary-900 text-primary-100 pt-12 pb-8 mt-16">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm text-primary-300">
      <p>© 2026 Niffer Cosmetics</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const product = getProductById(id);
      const container = document.getElementById('productDetail');

      if (!product) {
        container.innerHTML = `<div class="text-center py-20"><p class="text-gray-500 mb-4">Product not found</p><a href="products.html" class="text-primary-600 font-medium">${t('back_to_shop')}</a></div>`;
        return;
      }

      const lang = currentLang;
      const name = product.name[lang] || product.name.en;
      const desc = product.description[lang] || product.description.en;
      const howTo = product.howToUse[lang] || product.howToUse.en;
      const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;

      document.title = name + ' | Niffer Cosmetics';

      container.innerHTML = `
        <a href="products.html" class="inline-flex items-center text-sm text-primary-600 hover:text-primary-700 mb-6">${t('back_to_shop')}</a>
        <div class="grid md:grid-cols-2 gap-10">
          <div class="aspect-square rounded-3xl bg-gradient-to-br from-primary-50 to-primary-100 flex items-center justify-center text-9xl relative">
            ${product.image}
            ${product.badge ? `<span class="absolute top-6 left-6 px-3 py-1.5 bg-primary-600 text-white text-sm font-medium rounded-full">${product.badge}</span>` : ''}
          </div>
          <div>
            <p class="text-sm text-primary-500 uppercase tracking-wide mb-2">${product.category}</p>
            <h1 class="font-display text-3xl md:text-4xl font-bold text-primary-900 mb-3">${name}</h1>
            <div class="flex items-center gap-2 mb-4">
              <span class="text-amber-500">${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5-Math.floor(product.rating))}</span>
              <span class="text-sm text-gray-500">${product.rating} (${product.reviews} ${t('reviews')})</span>
            </div>
            <div class="flex items-baseline gap-3 mb-6">
              <span class="text-3xl font-bold text-primary-700">${formatPrice(product.price)}</span>
              ${product.originalPrice ? `<span class="text-lg text-gray-400 line-through">${formatPrice(product.originalPrice)}</span><span class="px-2 py-0.5 bg-gold-500 text-white text-xs rounded-full">-${discount}%</span>` : ''}
            </div>
            <p class="text-green-600 text-sm font-medium mb-6 flex items-center gap-1">
              <span class="w-2 h-2 bg-green-500 rounded-full"></span> ${product.stock > 0 ? t('in_stock') + ` (${product.stock})` : t('out_of_stock')}
            </p>
            <div class="flex items-center gap-4 mb-8">
              <label class="text-sm font-medium">${t('quantity')}</label>
              <div class="flex items-center border border-primary-200 rounded-full overflow-hidden">
                <button onclick="changeQty(-1)" class="px-4 py-2 hover:bg-primary-50">−</button>
                <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" class="w-14 text-center border-0 focus:ring-0 py-2">
                <button onclick="changeQty(1)" class="px-4 py-2 hover:bg-primary-50">+</button>
              </div>
            </div>
            <button onclick="addToCart(${product.id}, parseInt(document.getElementById('qtyInput').value))" class="w-full sm:w-auto px-8 py-3.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-full shadow-lg shadow-primary-200 transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
              ${t('add_to_cart')}
            </button>

            <div class="mt-10 space-y-6">
              <div>
                <h3 class="font-semibold text-lg mb-2">${t('description')}</h3>
                <p class="text-gray-600 leading-relaxed">${desc}</p>
              </div>
              <div>
                <h3 class="font-semibold text-lg mb-2">${t('how_to_use')}</h3>
                <p class="text-gray-600 leading-relaxed">${howTo}</p>
              </div>
              <div>
                <h3 class="font-semibold text-lg mb-2">${t('ingredients')}</h3>
                <p class="text-gray-600 text-sm">${product.ingredients}</p>
              </div>
            </div>
          </div>
        </div>
      `;
      updateCartCount();
    });

    function changeQty(delta) {
      const input = document.getElementById('qtyInput');
      let val = parseInt(input.value) + delta;
      val = Math.max(1, Math.min(val, parseInt(input.max)));
      input.value = val;
    }
  </script>
</body>
</html>
