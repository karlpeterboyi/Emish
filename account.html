<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Niffer Cosmetics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843' },
            cream: '#fef7f0'
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cream font-sans text-gray-800 antialiased">
  <div class="bg-primary-700 text-white text-center py-2 text-sm">
    <span data-i18n="announcement">Free delivery in Dar es Salaam for orders over TZS 50,000 | Referral commissions available!</span>
  </div>

  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-primary-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-display font-bold text-lg">N</div>
          <div>
            <span class="font-display text-xl font-semibold text-primary-800">Niffer</span>
            <span class="text-xs block text-primary-500 -mt-1 tracking-wider">COSMETICS</span>
          </div>
        </a>
        <div class="flex items-center gap-3">
          <button id="langToggle" class="flex items-center gap-1 px-3 py-1.5 rounded-full border border-primary-200 text-sm font-medium hover:bg-primary-50">
            <span id="langLabel">EN</span>
          </button>
          <a href="cart.html" class="relative p-2 rounded-full hover:bg-primary-50">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-primary-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-medium hidden">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-md mx-auto px-4 py-12">
    <div id="authSection">
      <div class="bg-white rounded-3xl p-8 shadow-sm border border-primary-50">
        <div class="flex gap-2 mb-6">
          <button id="tabLogin" class="flex-1 py-2 rounded-full font-medium bg-primary-600 text-white">Login</button>
          <button id="tabRegister" class="flex-1 py-2 rounded-full font-medium text-gray-600 hover:bg-primary-50">Register</button>
        </div>

        <form id="loginForm" class="space-y-4">
          <h2 class="font-display text-2xl font-bold text-center mb-2" data-i18n="login_title">Welcome Back</h2>
          <p id="loginError" class="text-red-500 text-sm hidden"></p>
          <div>
            <label class="block text-sm font-medium mb-1" data-i18n="phone">Phone Number</label>
            <input type="tel" name="phone" required placeholder="2557XXXXXXXX" class="w-full px-4 py-2.5 rounded-xl border border-primary-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" data-i18n="password">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-primary-200">
          </div>
          <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-full font-semibold hover:bg-primary-700" data-i18n="login">Login</button>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
          <h2 class="font-display text-2xl font-bold text-center mb-2" data-i18n="register_title">Create Account</h2>
          <p id="registerError" class="text-red-500 text-sm hidden"></p>
          <div>
            <label class="block text-sm font-medium mb-1" data-i18n="name">Full Name</label>
            <input type="text" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-primary-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" data-i18n="phone">Phone Number</label>
            <input type="tel" name="phone" required placeholder="2557XXXXXXXX" class="w-full px-4 py-2.5 rounded-xl border border-primary-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" data-i18n="password">Password</label>
            <input type="password" name="password" required minlength="4" class="w-full px-4 py-2.5 rounded-xl border border-primary-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Referral Code (optional)</label>
            <input type="text" name="referralCode" class="w-full px-4 py-2.5 rounded-xl border border-primary-200 uppercase">
          </div>
          <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-full font-semibold hover:bg-primary-700" data-i18n="register">Register</button>
        </form>
      </div>
    </div>

    <div id="dashboardSection" class="hidden">
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-primary-50 mb-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <p class="text-sm text-gray-500">Karibu,</p>
            <h2 id="userName" class="font-display text-xl font-bold text-primary-900"></h2>
            <p id="userPhone" class="text-sm text-gray-500"></p>
          </div>
          <button id="logoutBtn" class="text-sm text-red-500 hover:underline" data-i18n="logout">Logout</button>
        </div>
        <div class="flex gap-2">
          <a href="referral.html" class="flex-1 py-3 text-center bg-primary-50 text-primary-700 rounded-xl font-medium hover:bg-primary-100 text-sm">Refer & Earn</a>
          <a href="admin.html" id="adminLink" class="hidden flex-1 py-3 text-center bg-amber-50 text-amber-700 rounded-xl font-medium hover:bg-amber-100 text-sm">Admin</a>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-6 shadow-sm border border-primary-50">
        <h3 class="font-semibold mb-4">Recent Orders</h3>
        <div id="ordersList" class="space-y-3 text-sm"></div>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    function formatPrice(n) {
      return new Intl.NumberFormat('en-TZ').format(n) + ' TZS';
    }

    function showDashboard(user) {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userPhone').textContent = user.phone;
      if (user.role === 'ADMIN' || user.role === 'STAFF') {
        document.getElementById('adminLink').classList.remove('hidden');
      }
      loadOrders();
    }

    async function loadOrders() {
      const list = document.getElementById('ordersList');
      try {
        const res = await window.NifferAPI.getMyOrders();
        const orders = res.data || [];
        if (orders.length === 0) {
          list.innerHTML = '<p class="text-gray-400">No orders yet</p>';
          return;
        }
        list.innerHTML = orders.map(o => `
          <div class="flex justify-between items-center p-3 bg-primary-50 rounded-xl">
            <div>
              <p class="font-medium">${o.orderNumber}</p>
              <p class="text-xs text-gray-500">${new Date(o.createdAt).toLocaleDateString()}</p>
            </div>
            <div class="text-right">
              <p class="font-semibold text-primary-700">${formatPrice(o.total)}</p>
              <p class="text-xs ${o.paymentStatus === 'COMPLETED' ? 'text-green-600' : 'text-amber-600'}">${o.status}</p>
            </div>
          </div>
        `).join('');
      } catch (e) {
        // Fallback to localStorage orders
        const local = JSON.parse(localStorage.getItem('niffer_orders') || '[]');
        if (local.length === 0) list.innerHTML = '<p class="text-gray-400">No orders yet</p>';
        else list.innerHTML = local.slice(0,5).map(o => `
          <div class="flex justify-between p-3 bg-primary-50 rounded-xl">
            <span class="font-medium">${o.id || o.orderNumber}</span>
            <span class="text-primary-700">${formatPrice(o.total)}</span>
          </div>
        `).join('');
      }
    }

    document.getElementById('tabLogin').onclick = () => {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('tabLogin').className = 'flex-1 py-2 rounded-full font-medium bg-primary-600 text-white';
      document.getElementById('tabRegister').className = 'flex-1 py-2 rounded-full font-medium text-gray-600 hover:bg-primary-50';
    };
    document.getElementById('tabRegister').onclick = () => {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('tabRegister').className = 'flex-1 py-2 rounded-full font-medium bg-primary-600 text-white';
      document.getElementById('tabLogin').className = 'flex-1 py-2 rounded-full font-medium text-gray-600 hover:bg-primary-50';
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      try {
        const res = await window.NifferAPI.login({
          phone: form.phone.value,
          password: form.password.value,
        });
        showDashboard(res.data.user);
      } catch (err) {
        // Fallback local
        if (err.isNetwork) {
          const localUser = { name: 'Local User', phone: form.phone.value, role: 'CUSTOMER', referralCode: 'LOCAL01' };
          localStorage.setItem('niffer_user', JSON.stringify(localUser));
          showDashboard(localUser);
          return;
        }
        errEl.textContent = err.message || 'Login failed';
        errEl.classList.remove('hidden');
      }
    };

    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('registerError');
      errEl.classList.add('hidden');
      try {
        const res = await window.NifferAPI.register({
          name: form.name.value,
          phone: form.phone.value,
          password: form.password.value,
          referralCode: form.referralCode.value || undefined,
        });
        showDashboard(res.data.user);
        alert('Account created! Your referral code: ' + res.data.user.referralCode);
      } catch (err) {
        if (err.isNetwork) {
          const code = (form.name.value.substring(0,4) + Math.random().toString(36).slice(2,6)).toUpperCase();
          const localUser = { name: form.name.value, phone: form.phone.value, role: 'CUSTOMER', referralCode: code };
          localStorage.setItem('niffer_user', JSON.stringify(localUser));
          showDashboard(localUser);
          return;
        }
        errEl.textContent = err.message || 'Registration failed';
        errEl.classList.remove('hidden');
      }
    };

    document.getElementById('logoutBtn').onclick = () => {
      window.NifferAPI.logout();
      location.reload();
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('niffer_token');
      const localUser = window.NifferAuth?.getUser();
      if (token) {
        try {
          const res = await window.NifferAPI.me();
          showDashboard(res.data);
          return;
        } catch {}
      }
      if (localUser) showDashboard(localUser);
      if (typeof updateCartCount === 'function') updateCartCount();
    });
  </script>
</body>
</html>
