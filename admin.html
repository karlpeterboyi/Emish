<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Emish Beauty Spa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin panel — self-contained, no storefront nav */
    :root {
      --admin-pink: #db2777;
      --admin-pink-dark: #9d174d;
      --admin-bg: #f8fafc;
    }
    body.admin-body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--admin-bg);
      color: #1e293b;
      margin: 0;
      min-height: 100vh;
    }
    .tab {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .tab.active {
      border-bottom: 2px solid var(--admin-pink);
      color: var(--admin-pink-dark);
      font-weight: 600;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    #gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(160deg, #fdf2f8 0%, #f8fafc 50%, #fce7f3 100%);
    }
    #gate.hidden { display: none !important; }
    #app.hidden { display: none !important; }
    .admin-login-card {
      background: #fff;
      width: 100%;
      max-width: 24rem;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(157, 23, 77, 0.12);
      padding: 1.5rem;
      border: 1px solid #fce7f3;
    }
    .admin-login-card input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }
    .admin-login-card input:focus {
      outline: 2px solid #f9a8d4;
      border-color: #db2777;
    }
    .admin-btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: #db2777;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .admin-btn-primary:hover { background: #be185d; }
    .admin-header {
      background: linear-gradient(90deg, #831843, #9d174d 40%, #be185d);
      color: #fff;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .admin-header img {
      height: 2rem;
      background: #fff;
      border-radius: 0.25rem;
      padding: 0.15rem 0.35rem;
    }
    .admin-tabs {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0.25rem;
    }
    .admin-tabs .tab { padding: 0.85rem 0.9rem; }
    .admin-main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem;
    }
    .admin-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      overflow-x: auto;
    }
    .admin-card table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .admin-card th {
      background: #f8fafc;
      text-align: left;
      padding: 0.5rem;
      font-weight: 600;
      color: #64748b;
    }
    .admin-card td { padding: 0.5rem; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .admin-card input[type="number"],
    .admin-card input:not([type]),
    .admin-card select {
      border: 1px solid #e2e8f0;
      border-radius: 0.35rem;
      padding: 0.25rem 0.4rem;
      max-width: 100%;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    @media (min-width: 768px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .stat-card {
      background: #fff;
      border: 1px solid #fce7f3;
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .stat-card p:first-child { font-size: 0.75rem; color: #64748b; margin: 0 0 0.25rem; }
    .stat-card p:last-child { font-size: 1.35rem; font-weight: 700; color: #be185d; margin: 0; }
    #err:not(.hidden) { display: block; color: #dc2626; font-size: 0.8rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="admin-body">
  <!-- LOGIN -->
  <div id="gate">
    <div class="admin-login-card">
      <div class="flex items-center gap-3 mb-6">
        <img src="images/brand/logo.jpg" alt="Emish" class="h-12 object-contain">
        <div>
          <h1 class="text-lg font-bold text-pink-800">Emish Admin Panel</h1>
          <p class="text-xs text-slate-500">Products · Services · Bookings · Referrals</p>
        </div>
      </div>
      <label class="block text-xs mb-1">Phone</label>
      <input id="phone" class="w-full border rounded-lg px-3 py-2 mb-3" value="255700000001">
      <label class="block text-xs mb-1">Password</label>
      <input id="pass" type="password" class="w-full border rounded-lg px-3 py-2 mb-3" value="admin123">
      <p id="err" class="text-red-600 text-xs mb-2 hidden"></p>
      <button id="btnLogin" class="admin-btn-primary">Sign in to Admin</button>
      <p class="text-xs text-slate-400 mt-3 text-center">Not the Account page — this is full CRUD admin.</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden min-h-screen">
    <header class="admin-header">
      <div class="flex items-center gap-2">
        <img src="images/brand/logo.jpg" class="h-8 bg-white rounded px-1" alt="">
        <strong>Emish Admin</strong>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <span id="who"></span>
        <a href="index.html" class="underline">Store</a>
        <button id="btnOut" class="bg-white/15 px-2 py-1 rounded">Logout</button>
      </div>
    </header>

    <div class="admin-tabs">
      <button class="tab active px-4 py-3 whitespace-nowrap" data-p="dash">Dashboard</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="products">Products</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="services">Services</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="bookings">Bookings</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="orders">Orders</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="referrals">Referrals</button>
      <button class="tab px-4 py-3 whitespace-nowrap" data-p="settings">Settings</button>
    </div>

    <main class="admin-main">
      <section id="p-dash" class="panel active">
        <h2 class="font-bold text-lg mb-3">Dashboard</h2>
        <div id="stats" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
      </section>

      <section id="p-products" class="panel">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-lg">Products CRUD</h2>
          <button id="newProduct" class="bg-pink-600 text-white px-3 py-2 rounded-lg text-xs">+ Add</button>
        </div>
        <div id="productFormBox" class="hidden bg-white border rounded-xl p-4 mb-3 space-y-2"></div>
        <div id="productTable" class="bg-white border rounded-xl overflow-x-auto"></div>
      </section>

      <section id="p-services" class="panel">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-lg">Services CRUD</h2>
          <button id="newService" class="bg-pink-600 text-white px-3 py-2 rounded-lg text-xs">+ Add</button>
        </div>
        <div id="serviceFormBox" class="hidden bg-white border rounded-xl p-4 mb-3 space-y-2"></div>
        <div id="serviceTable" class="bg-white border rounded-xl overflow-x-auto"></div>
      </section>

      <section id="p-bookings" class="panel">
        <h2 class="font-bold text-lg mb-3">Bookings</h2>
        <div id="bookingTable" class="bg-white border rounded-xl overflow-x-auto"></div>
      </section>

      <section id="p-orders" class="panel">
        <h2 class="font-bold text-lg mb-3">Orders</h2>
        <div id="orderTable" class="bg-white border rounded-xl overflow-x-auto"></div>
      </section>

      <section id="p-referrals" class="panel">
        <h2 class="font-bold text-lg mb-3">Referral commissions</h2>
        <p class="text-xs text-slate-500 mb-3">Products & services · default 5% · change in Settings</p>
        <div id="commTable" class="bg-white border rounded-xl overflow-x-auto"></div>
      </section>

      <section id="p-settings" class="panel">
        <h2 class="font-bold text-lg mb-3">Settings</h2>
        <div class="bg-white border rounded-xl p-4 max-w-md space-y-3">
          <label class="block text-xs">Product referral commission (e.g. 0.05 = 5%)</label>
          <input id="rateProd" class="w-full border rounded-lg px-3 py-2" type="number" step="0.01" min="0" max="1">
          <label class="block text-xs">Service referral commission (e.g. 0.05 = 5%)</label>
          <input id="rateSvc" class="w-full border rounded-lg px-3 py-2" type="number" step="0.01" min="0" max="1">
          <button id="saveSettings" class="w-full py-2.5 bg-pink-600 text-white rounded-lg font-medium">Save rates</button>
          <p id="setMsg" class="text-xs text-green-700 hidden">Saved</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    var API = localStorage.getItem('emish_api_url') || (function(){var s=localStorage.getItem('emish_api_url')||localStorage.getItem('niffer_api_url');if(s)return s;var h=location.hostname;if(h==='localhost'||h==='127.0.0.1')return 'https://emish-api.onrender.com/api';return 'https://emish-api.onrender.com/api';})();
    function tok() { return localStorage.getItem('emish_token') || localStorage.getItem('niffer_token') || ''; }
    function money(n) { return new Intl.NumberFormat('en-TZ').format(n||0) + ' TZS'; }
    async function api(path, opts) {
      opts = opts || {};
      var h = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (tok()) h.Authorization = 'Bearer ' + tok();
      var r = await fetch(API + path, Object.assign({}, opts, { headers: h }));
      var j = await r.json().catch(function(){ return {}; });
      if (!r.ok) throw new Error(j.error || j.message || ('Error ' + r.status));
      return j;
    }

    function openApp(user) {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('who').textContent = ((user && user.name) || 'Admin') + (user && user.role ? ' · ' + user.role : '');
      window.__emishRole = (user && user.role) || '';
      if (window.__emishRole === 'CASHIER') {
        document.querySelectorAll('.tab').forEach(function(b){
          if (['settings','referrals'].indexOf(b.dataset.p)>=0) b.style.display='none';
        });
      }
      loadDash();
    }

    document.getElementById('btnLogin').onclick = async function() {
      var err = document.getElementById('err');
      err.classList.add('hidden');
      try {
        var j = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            phone: document.getElementById('phone').value.trim(),
            password: document.getElementById('pass').value
          })
        });
        var data = j.data || j;
        var token = data.token;
        var user = data.user;
        if (!token) throw new Error('Login failed');
        var okRoles = ['ADMIN','SUPER_ADMIN','BRANCH_MANAGER','CASHIER','STAFF'];
        if (!user || okRoles.indexOf(user.role) < 0) throw new Error('Staff account required');
        localStorage.setItem('emish_token', token);
        localStorage.setItem('emish_user', JSON.stringify(user));
        openApp(user);
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    };
    document.getElementById('btnOut').onclick = function() {
      localStorage.removeItem('emish_token');
      localStorage.removeItem('niffer_token');
      location.reload();
    };

    document.querySelectorAll('.tab').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('p-' + btn.dataset.p).classList.add('active');
        var p = btn.dataset.p;
        if (p === 'dash') loadDash();
        if (p === 'products') loadProducts();
        if (p === 'services') loadServices();
        if (p === 'bookings') loadBookings();
        if (p === 'orders') loadOrders();
        if (p === 'referrals') loadComms();
        if (p === 'settings') loadSettings();
      };
    });

    async function loadDash() {
      var el = document.getElementById('stats');
      try {
        var j = await api('/admin/dashboard');
        var d = j.data || {};
        el.innerHTML = [
          ['Products', d.products],
          ['Services', d.services],
          ['Bookings', d.bookings],
          ['Orders', d.orders],
          ['Revenue', money(d.revenue)],
          ['Pending commissions', money(d.pendingCommissions)],
          ['Product ref %', ((d.commissionRateProducts||0.05)*100).toFixed(0) + '%'],
          ['Service ref %', ((d.commissionRateServices||0.05)*100).toFixed(0) + '%']
        ].map(function(x){
          return '<div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">'+x[0]+'</p><p class="text-xl font-bold text-pink-700">'+x[1]+'</p></div>';
        }).join('');
      } catch (e) {
        el.innerHTML = '<p class="text-red-600">'+e.message+'</p><p class="text-xs mt-2">Is backend running on port 4000?</p>';
      }
    }

    async function loadProducts() {
      var box = document.getElementById('productTable');
      box.innerHTML = 'Loading…';
      try {
        var j = await api('/admin/products');
        var list = j.data || [];
        if (!list.length) {
          box.innerHTML = '<p class="p-4 text-sm text-slate-500">No products yet. Click + Add.</p>';
          return;
        }
        var rows = list.map(function(p){
          var imgs = parseImgs(p.images);
          var thumb = imgs[0]
            ? '<img src="'+esc(imgs[0])+'" class="w-14 h-14 object-cover rounded-lg border" onerror="this.src=\'\';this.outerHTML=\'<span class=text-xs>—</span>\'">'
            : '<span class="text-slate-400 text-xs">No img</span>';
          return '<tr class="border-t align-top hover:bg-slate-50">'+
            '<td class="p-2">'+thumb+'</td>'+
            '<td class="p-2"><div class="font-medium text-sm">'+esc(p.nameEn)+'</div>'+
              '<div class="text-xs text-slate-400">'+esc(p.slug)+'</div>'+
              (p.isFeatured ? '<span class="text-[10px] bg-amber-100 text-amber-800 px-1 rounded">Featured</span>' : '')+
            '</td>'+
            '<td class="p-2 text-sm">'+money(p.price)+'</td>'+
            '<td class="p-2 text-sm">'+p.stock+'</td>'+
            '<td class="p-2 text-xs">'+(p.isActive!==false?'<span class="text-green-700">Active</span>':'<span class="text-red-600">Off</span>')+'</td>'+
            '<td class="p-2 space-y-1 whitespace-nowrap">'+
              '<button data-id="'+p.id+'" class="editP text-blue-600 text-xs font-medium block">Edit</button>'+
              '<button data-id="'+p.id+'" class="delP text-red-600 text-xs block">Delete</button>'+
            '</td></tr>';
        }).join('');
        box.innerHTML = '<table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr>'+
          '<th class="p-2">Image</th><th class="p-2">Name</th><th class="p-2">Price</th><th class="p-2">Stock</th><th class="p-2">Status</th><th class="p-2"></th>'+
          '</tr></thead><tbody>'+rows+'</tbody></table>';

        box.querySelectorAll('.editP').forEach(function(b){
          b.onclick = function(){
            var p = list.find(function(x){ return x.id === b.dataset.id; });
            if (p) showProductForm(p);
          };
        });
        box.querySelectorAll('.delP').forEach(function(b){
          b.onclick = async function(){
            if (!confirm('Deactivate this product? (soft delete)')) return;
            try {
              await api('/products/'+b.dataset.id, { method:'DELETE' });
              loadProducts();
            } catch(e){ alert(e.message); }
          };
        });
      } catch (e) {
        box.innerHTML = '<p class="p-4 text-red-600 text-sm">'+esc(e.message)+'</p>';
      }
    }

    function parseImgs(raw) {
      try {
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'string') return JSON.parse(raw || '[]');
      } catch(e) {}
      return [];
    }
    function esc(s) {
      return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }
    function apiOrigin() {
      return String(API || '').replace(/\/api\/?$/, '');
    }
    async function uploadImageFile(file) {
      return new Promise(function(resolve, reject) {
        if (!file || !file.type || file.type.indexOf('image/') !== 0) {
          reject(new Error('Choose an image file (jpg/png/webp)'));
          return;
        }
        if (file.size > 5.5 * 1024 * 1024) {
          reject(new Error('Image max 5.5MB'));
          return;
        }
        var reader = new FileReader();
        reader.onload = async function() {
          try {
            var dataUrl = reader.result;
            var j = await api('/uploads/image', {
              method: 'POST',
              body: JSON.stringify({
                image: dataUrl,
                filename: (file.name || 'product').replace(/\s+/g, '-').toLowerCase()
              })
            });
            var url = (j.data && (j.data.url || j.data.path)) || '';
            if (!url) throw new Error('Upload failed');
            // Prefer absolute URL for storefront
            if (url.charAt(0) === '/') url = apiOrigin() + url;
            resolve(url);
          } catch (e) { reject(e); }
        };
        reader.onerror = function(){ reject(new Error('Could not read file')); };
        reader.readAsDataURL(file);
      });
    }

    async function showProductForm(product) {
      var box = document.getElementById('productFormBox');
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      var cats = [];
      try { cats = (await api('/products/meta/categories')).data || []; } catch(e) {}
      var isEdit = !!(product && product.id);
      var imgs = isEdit ? parseImgs(product.images) : [];
      var catOpts = cats.map(function(c){
        var sel = isEdit && product.categoryId === c.id ? ' selected' : '';
        return '<option value="'+c.id+'"'+sel+'>'+esc(c.nameEn || c.slug)+'</option>';
      }).join('');

      box.innerHTML =
        '<div class="flex justify-between items-center mb-2">'+
          '<p class="font-semibold text-sm">'+(isEdit ? 'Edit product' : 'Add product')+'</p>'+
          '<button type="button" id="pf_close" class="text-xs text-slate-500">Close</button>'+
        '</div>'+
        '<div class="grid md:grid-cols-2 gap-2">'+
          '<input id="pf_name" class="border rounded-lg px-3 py-2 text-sm" placeholder="Name (English) *" value="'+(isEdit?esc(product.nameEn):'')+'">'+
          '<input id="pf_name_sw" class="border rounded-lg px-3 py-2 text-sm" placeholder="Name (Swahili)" value="'+(isEdit?esc(product.nameSw||''):'')+'">'+
          '<input id="pf_slug" class="border rounded-lg px-3 py-2 text-sm" placeholder="slug-auto-from-name" value="'+(isEdit?esc(product.slug):'')+'">'+
          '<select id="pf_cat" class="border rounded-lg px-3 py-2 text-sm"><option value="">Category *</option>'+catOpts+'</select>'+
          '<input id="pf_price" type="number" min="0" class="border rounded-lg px-3 py-2 text-sm" placeholder="Price TZS *" value="'+(isEdit?product.price:'')+'">'+
          '<input id="pf_stock" type="number" min="0" class="border rounded-lg px-3 py-2 text-sm" placeholder="Stock *" value="'+(isEdit?product.stock:10)+'">'+
        '</div>'+
        '<textarea id="pf_desc" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm mt-2" placeholder="Description">'+(isEdit?esc(product.descriptionEn||''):'')+'</textarea>'+
        '<div class="mt-3 border-t pt-3">'+
          '<p class="text-xs font-medium text-slate-600 mb-1">Images</p>'+
          '<p class="text-[11px] text-slate-400 mb-2">Upload from phone/PC or paste image URLs</p>'+
          '<div class="flex flex-wrap gap-2 mb-2" id="pf_previews"></div>'+
          '<input type="file" id="pf_file" accept="image/*" class="text-xs mb-2 block w-full">'+
          '<button type="button" id="pf_upload_btn" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg mb-2">Upload selected file</button>'+
          '<p id="pf_up_msg" class="text-xs text-slate-500 mb-2"></p>'+
          '<input id="pf_img1" class="w-full border rounded-lg px-3 py-2 text-sm mb-1" placeholder="Image 1 URL" value="'+esc(imgs[0]||'')+'">'+
          '<input id="pf_img2" class="w-full border rounded-lg px-3 py-2 text-sm mb-1" placeholder="Image 2 URL (optional)" value="'+esc(imgs[1]||'')+'">'+
          '<input id="pf_img3" class="w-full border rounded-lg px-3 py-2 text-sm mb-1" placeholder="Image 3 URL (optional)" value="'+esc(imgs[2]||'')+'">'+
        '</div>'+
        '<label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" id="pf_featured" '+(isEdit&&product.isFeatured?'checked':'')+'> Featured on home</label>'+
        (isEdit ? '<label class="flex items-center gap-2 text-sm mt-1"><input type="checkbox" id="pf_active" '+(product.isActive!==false?'checked':'')+'> Active (visible in shop)</label>' : '')+
        '<div class="flex gap-2 mt-3">'+
          '<button type="button" id="pf_save" class="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-medium">'+(isEdit?'Update product':'Save product')+'</button>'+
          '<button type="button" id="pf_cancel" class="border px-4 py-2 rounded-lg text-sm">Cancel</button>'+
        '</div>';

      function refreshPreviews() {
        var urls = [document.getElementById('pf_img1').value, document.getElementById('pf_img2').value, document.getElementById('pf_img3').value].filter(Boolean);
        document.getElementById('pf_previews').innerHTML = urls.map(function(u){
          return '<img src="'+esc(u)+'" class="w-16 h-16 object-cover rounded-lg border" onerror="this.style.opacity=0.3">';
        }).join('') || '<span class="text-xs text-slate-400">No images yet</span>';
      }
      ['pf_img1','pf_img2','pf_img3'].forEach(function(id){
        document.getElementById(id).oninput = refreshPreviews;
      });
      refreshPreviews();

      document.getElementById('pf_close').onclick = document.getElementById('pf_cancel').onclick = function(){
        box.classList.add('hidden'); box.innerHTML = '';
      };

      document.getElementById('pf_upload_btn').onclick = async function(){
        var msg = document.getElementById('pf_up_msg');
        var fileInput = document.getElementById('pf_file');
        var file = fileInput.files && fileInput.files[0];
        if (!file) { msg.textContent = 'Choose a file first'; return; }
        msg.textContent = 'Uploading…';
        try {
          var url = await uploadImageFile(file);
          var slots = ['pf_img1','pf_img2','pf_img3'];
          var placed = false;
          for (var i=0;i<slots.length;i++) {
            var el = document.getElementById(slots[i]);
            if (!el.value) { el.value = url; placed = true; break; }
          }
          if (!placed) document.getElementById('pf_img1').value = url;
          refreshPreviews();
          msg.textContent = 'Uploaded ✓';
          msg.className = 'text-xs text-green-700 mb-2';
        } catch(e) {
          msg.textContent = e.message || 'Upload failed';
          msg.className = 'text-xs text-red-600 mb-2';
        }
      };

      document.getElementById('pf_save').onclick = async function(){
        try {
          var name = document.getElementById('pf_name').value.trim();
          if (!name) throw new Error('Name is required');
          var slug = document.getElementById('pf_slug').value.trim() ||
            name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          var cat = document.getElementById('pf_cat').value;
          if (!cat) throw new Error('Category is required');
          var price = parseInt(document.getElementById('pf_price').value, 10);
          if (!price || price < 1) throw new Error('Price must be > 0');
          var stock = parseInt(document.getElementById('pf_stock').value, 10);
          if (isNaN(stock) || stock < 0) stock = 0;
          var imgs = [
            document.getElementById('pf_img1').value.trim(),
            document.getElementById('pf_img2').value.trim(),
            document.getElementById('pf_img3').value.trim()
          ].filter(Boolean);
          var payload = {
            nameEn: name,
            nameSw: document.getElementById('pf_name_sw').value.trim() || name,
            slug: slug,
            descriptionEn: document.getElementById('pf_desc').value.trim() || name,
            descriptionSw: document.getElementById('pf_desc').value.trim() || name,
            price: price,
            stock: stock,
            categoryId: cat,
            images: imgs,
            isFeatured: document.getElementById('pf_featured').checked
          };
          if (isEdit) {
            payload.isActive = document.getElementById('pf_active').checked;
            await api('/products/'+product.id, { method:'PATCH', body: JSON.stringify(payload) });
            alert('Product updated');
          } else {
            payload.isActive = true;
            await api('/products', { method:'POST', body: JSON.stringify(payload) });
            alert('Product created');
          }
          box.classList.add('hidden');
          box.innerHTML = '';
          loadProducts();
        } catch(e) { alert(e.message); }
      };
    }

    document.getElementById('newProduct').onclick = function() {
      showProductForm(null);
    };

    async function loadServices() {
      var box = document.getElementById('serviceTable');
      box.innerHTML = 'Loading…';
      try {
        var j = await api('/admin/services');
        var list = j.data || [];
        var rows = list.map(function(s){
          var thumb = s.imageUrl
            ? '<img src="'+s.imageUrl+'" class="w-12 h-12 object-cover rounded border" onerror="this.outerHTML=\'—\'">'
            : '<span class="text-slate-400 text-xs">No img</span>';
          return '<tr class="border-t align-top">'+
            '<td class="p-2">'+thumb+'</td>'+
            '<td class="p-2">'+s.nameEn+'<div class="text-xs text-slate-400">'+s.slug+'</div></td>'+
            '<td class="p-2"><input data-id="'+s.id+'" class="sdur w-16 border rounded px-1" type="number" value="'+s.durationMinutes+'"></td>'+
            '<td class="p-2"><input data-id="'+s.id+'" class="spr w-24 border rounded px-1" type="number" value="'+s.price+'"></td>'+
            '<td class="p-2 space-y-1">'+
              '<button data-id="'+s.id+'" class="saveS text-pink-600 text-xs block">Save</button>'+
              '<button data-id="'+s.id+'" class="editS text-blue-600 text-xs block">Edit image</button>'+
              '<button data-id="'+s.id+'" class="delS text-red-600 text-xs block">Delete</button>'+
            '</td></tr>';
        }).join('');
        box.innerHTML = '<table class="w-full text-left"><thead class="bg-slate-50 text-xs"><tr><th class="p-2">Img</th><th class="p-2">Name</th><th class="p-2">Time</th><th class="p-2">Price</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
        box.querySelectorAll('.saveS').forEach(function(b){
          b.onclick = async function(){
            var dur = box.querySelector('input.sdur[data-id="'+b.dataset.id+'"]');
            var pr = box.querySelector('input.spr[data-id="'+b.dataset.id+'"]');
            await api('/services/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({
              durationMinutes: parseInt(dur.value,10),
              price: parseInt(pr.value,10)
            })});
            loadServices();
          };
        });
        box.querySelectorAll('.editS').forEach(function(b){
          b.onclick = function(){
            var s = list.find(function(x){ return x.id === b.dataset.id; });
            if (!s) return;
            var boxf = document.getElementById('serviceFormBox');
            boxf.classList.remove('hidden');
            boxf.innerHTML =
              '<p class="text-sm font-semibold mb-2">Edit: '+s.nameEn+'</p>'+
              '<input id="es_name" class="w-full border rounded px-2 py-1 mb-1" value="'+String(s.nameEn||'').replace(/"/g,'&quot;')+'">'+
              '<input id="es_price" type="number" class="w-full border rounded px-2 py-1 mb-1" value="'+s.price+'">'+
              '<input id="es_dur" type="number" class="w-full border rounded px-2 py-1 mb-1" value="'+s.durationMinutes+'">'+
              '<input id="es_img" class="w-full border rounded px-2 py-1 mb-1" placeholder="Image URL https://..." value="'+(s.imageUrl||'')+'">'+
              '<div class="flex gap-2">'+
                '<button id="es_save" class="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm">Update</button>'+
                '<button id="es_cancel" class="border px-4 py-2 rounded-lg text-sm">Cancel</button>'+
              '</div>';
            document.getElementById('es_cancel').onclick = function(){ boxf.classList.add('hidden'); };
            document.getElementById('es_save').onclick = async function(){
              try {
                await api('/services/'+s.id,{method:'PATCH',body:JSON.stringify({
                  nameEn: document.getElementById('es_name').value.trim(),
                  price: parseInt(document.getElementById('es_price').value,10),
                  durationMinutes: parseInt(document.getElementById('es_dur').value,10),
                  imageUrl: document.getElementById('es_img').value.trim() || null
                })});
                boxf.classList.add('hidden');
                loadServices();
              } catch(e){ alert(e.message); }
            };
          };
        });
        box.querySelectorAll('.delS').forEach(function(b){
          b.onclick = async function(){ if(confirm('Delete service?')) { await api('/services/'+b.dataset.id,{method:'DELETE'}); loadServices(); } };
        });
      } catch(e) { box.innerHTML = '<p class="p-4 text-red-600">'+e.message+'</p>'; }
    }

    document.getElementById('newService').onclick = async function() {
      var cats = [];
      try { cats = (await api('/admin/service-categories')).data || []; } catch(e) {}
      var box = document.getElementById('serviceFormBox');
      box.classList.remove('hidden');
      var catOpts = cats.map(function(c){ return '<option value="'+c.id+'">'+(c.nameEn||c.slug)+'</option>'; }).join('');
      if (!catOpts) catOpts = '<option value="">No categories — seed DB</option>';
      box.innerHTML =
        '<input id="ns_name" class="w-full border rounded px-2 py-1" placeholder="Service name EN">'+
        '<input id="ns_name_sw" class="w-full border rounded px-2 py-1" placeholder="Name SW (optional)">'+
        '<input id="ns_slug" class="w-full border rounded px-2 py-1" placeholder="slug-like-this">'+
        '<textarea id="ns_desc" class="w-full border rounded px-2 py-1" rows="2" placeholder="Description"></textarea>'+
        '<div class="grid grid-cols-2 gap-2">'+
          '<input id="ns_price" type="number" class="border rounded px-2 py-1" placeholder="Price TZS">'+
          '<input id="ns_dur" type="number" class="border rounded px-2 py-1" placeholder="Minutes" value="60">'+
        '</div>'+
        '<select id="ns_cat" class="w-full border rounded px-2 py-1">'+catOpts+'</select>'+
        '<input id="ns_img" class="w-full border rounded px-2 py-1" placeholder="Image URL (https://...)">'+
        '<div class="flex gap-2 mt-1">'+
          '<button id="ns_save" class="bg-pink-600 text-white px-4 py-2 rounded-lg text-sm">Save service</button>'+
          '<button id="ns_cancel" class="border px-4 py-2 rounded-lg text-sm">Cancel</button>'+
        '</div>';
      document.getElementById('ns_cancel').onclick = function(){ box.classList.add('hidden'); };
      document.getElementById('ns_save').onclick = async function(){
        try {
          var name = document.getElementById('ns_name').value.trim();
          var slug = document.getElementById('ns_slug').value.trim() || name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          if (!name) throw new Error('Name required');
          if (!document.getElementById('ns_cat').value) throw new Error('Category required');
          await api('/services', { method:'POST', body: JSON.stringify({
            nameEn: name,
            nameSw: document.getElementById('ns_name_sw').value.trim() || name,
            slug: slug,
            descriptionEn: document.getElementById('ns_desc').value || name,
            descriptionSw: document.getElementById('ns_desc').value || name,
            price: parseInt(document.getElementById('ns_price').value,10) || 0,
            durationMinutes: parseInt(document.getElementById('ns_dur').value,10) || 60,
            categoryId: document.getElementById('ns_cat').value,
            imageUrl: document.getElementById('ns_img').value.trim() || undefined
          })});
          box.classList.add('hidden');
          loadServices();
        } catch(e){ alert(e.message); }
      };
    };

    async function loadBookings() {
      var box = document.getElementById('bookingTable');
      try {
        var j = await api('/bookings');
        var rows = (j.data||[]).map(function(b){
          return '<tr class="border-t"><td class="p-2 text-xs">'+b.bookingNumber+'</td><td class="p-2">'+(b.service&&b.service.nameEn||'')+'</td><td class="p-2">'+b.customerName+'<br><span class="text-xs">'+b.customerPhone+'</span></td><td class="p-2 text-xs">'+new Date(b.scheduledAt).toLocaleString()+'</td>'+
            '<td class="p-2"><select data-id="'+b.id+'" class="bst border rounded text-xs">'+
            ['PENDING','CONFIRMED','COMPLETED','CANCELLED'].map(function(s){ return '<option '+(b.status===s?'selected':'')+'>'+s+'</option>'; }).join('')+
            '</select></td></tr>';
        }).join('');
        box.innerHTML = '<table class="w-full"><thead class="bg-slate-50 text-xs"><tr><th class="p-2">#</th><th class="p-2">Service</th><th class="p-2">Client</th><th class="p-2">When</th><th class="p-2">Status</th></tr></thead><tbody>'+(rows||'<tr><td class="p-4" colspan="5">None</td></tr>')+'</tbody></table>';
        box.querySelectorAll('.bst').forEach(function(s){
          s.onchange = async function(){ await api('/bookings/'+s.dataset.id+'/status',{method:'PATCH',body:JSON.stringify({status:s.value})}); };
        });
      } catch(e){ box.innerHTML = '<p class="p-4 text-red-600">'+e.message+'</p>'; }
    }

    async function loadOrders() {
      var box = document.getElementById('orderTable');
      try {
        var j = await api('/admin/orders');
        var rows = (j.data||[]).map(function(o){
          return '<tr class="border-t"><td class="p-2 text-xs">'+o.orderNumber+'</td><td class="p-2">'+o.customerName+'</td><td class="p-2">'+money(o.total)+'</td><td class="p-2 text-xs">'+o.status+' / '+o.paymentStatus+'</td></tr>';
        }).join('');
        box.innerHTML = '<table class="w-full"><thead class="bg-slate-50 text-xs"><tr><th class="p-2">Order</th><th class="p-2">Customer</th><th class="p-2">Total</th><th class="p-2">Status</th></tr></thead><tbody>'+(rows||'<tr><td class="p-4">None</td></tr>')+'</tbody></table>';
      } catch(e){ box.innerHTML = '<p class="p-4 text-red-600">'+e.message+'</p>'; }
    }

    async function loadComms() {
      var box = document.getElementById('commTable');
      try {
        var j = await api('/admin/commissions');
        var rows = (j.data||[]).map(function(c){
          return '<tr class="border-t"><td class="p-2 text-xs">'+(c.user&&c.user.name||'')+'</td><td class="p-2 text-xs">'+(c.source||'PRODUCT')+'</td><td class="p-2">'+money(c.amount)+'</td><td class="p-2 text-xs">'+(c.rate*100)+'%</td><td class="p-2">'+
            '<select data-id="'+c.id+'" class="cst border rounded text-xs">'+
            ['PENDING','APPROVED','PAID'].map(function(s){ return '<option '+(c.status===s?'selected':'')+'>'+s+'</option>'; }).join('')+
            '</select></td></tr>';
        }).join('');
        box.innerHTML = '<table class="w-full"><thead class="bg-slate-50 text-xs"><tr><th class="p-2">Referrer</th><th class="p-2">Source</th><th class="p-2">Amount</th><th class="p-2">Rate</th><th class="p-2">Status</th></tr></thead><tbody>'+(rows||'<tr><td class="p-4">No commissions yet</td></tr>')+'</tbody></table>';
        box.querySelectorAll('.cst').forEach(function(s){
          s.onchange = async function(){ await api('/admin/commissions/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})}); };
        });
      } catch(e){ box.innerHTML = '<p class="p-4 text-red-600">'+e.message+'</p>'; }
    }

    async function loadSettings() {
      try {
        var j = await api('/admin/settings');
        var d = j.data || {};
        document.getElementById('rateProd').value = d.commission_rate_products || '0.05';
        document.getElementById('rateSvc').value = d.commission_rate_services || '0.05';
      } catch(e){ alert(e.message); }
    }
    document.getElementById('saveSettings').onclick = async function() {
      await api('/admin/settings', {
        method: 'PATCH',
        body: JSON.stringify({
          commission_rate_products: document.getElementById('rateProd').value,
          commission_rate_services: document.getElementById('rateSvc').value
        })
      });
      var m = document.getElementById('setMsg');
      m.classList.remove('hidden');
      setTimeout(function(){ m.classList.add('hidden'); }, 2000);
    };

    // Auto open if already admin
    try {
      var u = JSON.parse(localStorage.getItem('emish_user') || 'null');
      var ok=['ADMIN','SUPER_ADMIN','BRANCH_MANAGER','CASHIER','STAFF'];
      if (tok() && u && ok.indexOf(u.role)>=0) openApp(u);
    } catch(e){}
  </script>
