<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Niffer Cosmetics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843' },
            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
            cream: '#fef7f0'
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cream font-sans text-gray-800 antialiased">
  <div class="bg-primary-700 text-white text-center py-2 text-sm">
    <span data-i18n="announcement">Free delivery in Dar es Salaam for orders over TZS 50,000 | Referral commissions available!</span>
  </div>

  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-primary-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-display font-bold text-lg">N</div>
          <div>
            <span class="font-display text-xl font-semibold text-primary-800">Niffer</span>
            <span class="text-xs block text-primary-500 -mt-1 tracking-wider">COSMETICS</span>
          </div>
        </a>
        <div class="flex items-center gap-3">
          <button id="langToggle" class="flex items-center gap-1 px-3 py-1.5 rounded-full border border-primary-200 text-sm font-medium hover:bg-primary-50">
            <span id="langLabel">EN</span>
          </button>
          <a href="account.html" class="p-2 rounded-full hover:bg-primary-50">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </a>
          <a href="cart.html" class="relative p-2 rounded-full hover:bg-primary-50">
            <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-primary-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-medium hidden">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="font-display text-3xl font-bold text-primary-900 mb-8" data-i18n="cart_title">Your Cart</h1>

    <div id="cartEmpty" class="hidden text-center py-16">
      <div class="text-6xl mb-4">🛒</div>
      <h2 class="text-xl font-semibold mb-2" data-i18n="cart_empty">Your cart is empty</h2>
      <p class="text-gray-500 mb-6" data-i18n="cart_empty_desc">Looks like you haven't added any products yet.</p>
      <a href="products.html" class="inline-flex px-6 py-3 bg-primary-600 text-white rounded-full font-medium hover:bg-primary-700" data-i18n="continue_shopping">Continue Shopping</a>
    </div>

    <div id="cartContent" class="hidden">
      <div id="cartItems" class="space-y-4 mb-8">
        <!-- Items -->
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border border-primary-50">
        <div class="space-y-3 text-sm">
          <div class="flex justify-between">
            <span data-i18n="subtotal">Subtotal</span>
            <span id="subtotalAmount" class="font-medium"></span>
          </div>
          <div class="flex justify-between text-gray-500">
            <span data-i18n="shipping">Shipping</span>
            <span data-i18n="free_shipping">Calculated at checkout</span>
          </div>
          <div class="border-t border-primary-100 pt-3 flex justify-between text-lg font-semibold">
            <span data-i18n="total">Total</span>
            <span id="totalAmount" class="text-primary-700"></span>
          </div>
        </div>
        <a href="checkout.html" class="mt-6 w-full flex items-center justify-center gap-2 px-6 py-3.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-full transition">
          <span data-i18n="proceed_checkout">Proceed to Checkout</span>
        </a>
        <a href="products.html" class="mt-3 block text-center text-sm text-primary-600 hover:underline" data-i18n="continue_shopping">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const empty = document.getElementById('cartEmpty');
      const content = document.getElementById('cartContent');
      const itemsEl = document.getElementById('cartItems');

      if (cart.length === 0) {
        empty.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      content.classList.remove('hidden');

      itemsEl.innerHTML = cart.map(item => {
        const p = getProductById(item.id);
        if (!p) return '';
        const name = p.name[currentLang] || p.name.en;
        return `
          <div class="bg-white rounded-2xl p-4 flex gap-4 shadow-sm border border-primary-50">
            <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-primary-50 to-primary-100 flex items-center justify-center text-3xl flex-shrink-0">${p.image}</div>
            <div class="flex-1 min-w-0">
              <a href="product.html?id=${p.id}" class="font-medium text-gray-900 hover:text-primary-600 line-clamp-1">${name}</a>
              <p class="text-sm text-primary-600 font-medium mt-1">${formatPrice(p.price)}</p>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center border border-primary-200 rounded-full overflow-hidden text-sm">
                  <button onclick="updateQty(${p.id}, ${item.qty - 1})" class="px-3 py-1 hover:bg-primary-50">−</button>
                  <span class="px-2">${item.qty}</span>
                  <button onclick="updateQty(${p.id}, ${item.qty + 1})" class="px-3 py-1 hover:bg-primary-50">+</button>
                </div>
                <button onclick="removeItem(${p.id})" class="text-sm text-red-500 hover:underline" data-i18n="remove">Remove</button>
              </div>
            </div>
            <div class="text-right font-semibold text-primary-700">${formatPrice(p.price * item.qty)}</div>
          </div>
        `;
      }).join('');

      const total = getCartTotal();
      document.getElementById('subtotalAmount').textContent = formatPrice(total);
      document.getElementById('totalAmount').textContent = formatPrice(total);
      updateCartCount();
    }

    function updateQty(id, qty) {
      if (qty < 1) removeFromCart(id);
      else updateCartQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      removeFromCart(id);
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
