<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status | Emish Beauty Spa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center">
    <div id="loading" class="py-8">
      <div class="w-12 h-12 border-4 border-pink-200 border-t-pink-600 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-gray-600">Confirming payment...</p>
    </div>
    <div id="result" class="hidden">
      <div id="icon" class="text-5xl mb-4"></div>
      <h1 id="title" class="text-2xl font-bold text-gray-900 mb-2"></h1>
      <p id="msg" class="text-gray-600 mb-2 text-sm leading-relaxed"></p>
      <p id="orderRef" class="font-mono text-pink-700 font-semibold mb-6"></p>
      <div class="flex flex-col sm:flex-row gap-2 justify-center">
        <a href="index.html" class="px-6 py-3 bg-pink-600 text-white rounded-full font-medium">Home</a>
        <a href="products.html" class="px-6 py-3 border border-pink-300 text-pink-700 rounded-full font-medium">Continue shopping</a>
        <a href="https://wa.me/255672283434" class="px-6 py-3 border border-green-300 text-green-700 rounded-full font-medium">WhatsApp</a>
      </div>
    </div>
  </div>
    <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var order =
        params.get('order') ||
        params.get('OrderMerchantReference') ||
        params.get('orderMerchantReference') ||
        params.get('merchant_reference') ||
        '';
      var booking =
        params.get('booking') ||
        '';
      if (!booking && order && String(order).indexOf('EB-') === 0) booking = order;
      var tracking =
        params.get('OrderTrackingId') ||
        params.get('orderTrackingId') ||
        params.get('order_tracking_id') ||
        '';
      var statusParam = (params.get('status') || '').toLowerCase();
      var demo = statusParam === 'demo';
      try {
        if (!order) order = sessionStorage.getItem('emish_last_order') || '';
        if (!booking) booking = sessionStorage.getItem('emish_last_booking') || '';
      } catch (e) {}

      var API = localStorage.getItem('emish_api_url') || localStorage.getItem('niffer_api_url') || 'http://localhost:4000/api';
      var ref = booking || order;

      function show(ok, title, text, r) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('icon').textContent = ok ? '✓' : (ok === null ? '…' : '!');
        document.getElementById('title').textContent = title;
        document.getElementById('msg').textContent = text;
        document.getElementById('orderRef').textContent = r ? ('Ref: ' + r) : '';
      }

      if (demo && booking) {
        try {
          await fetch(API + '/payments/demo-complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingNumber: booking }),
          });
        } catch (e) {}
        show(true, 'Booking paid', 'Payment received. Confirmation sent on WhatsApp/SMS with time and amount. Karibu Emish Beauty Spa!', booking);
        return;
      }

      if (demo && order) {
        try {
          await fetch(API + '/payments/demo-complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderNumber: order }),
          });
        } catch (e) {}
        show(true, 'Payment successful', 'Thank you for shopping with Emish Beauty Spa.', order);
        return;
      }

      if (!ref && !tracking) {
        show(null, 'Payment status', 'No reference found. WhatsApp 0672 283 434 if you already paid.', '');
        return;
      }

      if (booking) {
        try {
          var r = await fetch(API + '/payments/booking-status/' + encodeURIComponent(booking));
          var j = await r.json();
          var st = String((j.data && j.data.paymentStatus) || '').toUpperCase();
          if (st === 'COMPLETED') {
            show(true, 'Booking confirmed', 'Paid successfully. Check WhatsApp for appointment details.', booking);
            return;
          }
          show(null, 'Payment pending', 'Booking held. Complete Pesapal payment or contact 0672 283 434.', booking);
          return;
        } catch (e) {
          show(null, 'Payment pending', 'Could not confirm yet. Save your booking ref.', booking);
          return;
        }
      }

      if (order) {
        try {
          var r2 = await fetch(API + '/payments/status/' + encodeURIComponent(order));
          var j2 = await r2.json();
          var st2 = String((j2.data && (j2.data.paymentStatus || j2.data.status)) || '').toUpperCase();
          if (st2 === 'COMPLETED' || st2 === 'PAID') {
            show(true, 'Payment successful', 'Thank you!', order);
            return;
          }
          show(null, 'Payment pending', 'Order received. Confirmation may take a few minutes.', order);
          return;
        } catch (e) {
          show(null, 'Payment pending', 'Could not reach server.', order);
          return;
        }
      }

      show(null, 'Payment pending', 'Tracking received. We will confirm shortly.', tracking);
    })();
  </script>
</body>
</html>
